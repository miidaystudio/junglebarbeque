  <!-- Warm Baked Texture Layer -->
  <circle cx="32" cy="32" r="24" fill="#F59E0B" fill-opacity="0.25" />
  
  <!-- Chocolate Chips (Rich Dark Chunks) -->
  <!-- Chip 1 -->
  <path d="M 22 18 C 24 16, 28 17, 27 21 C 26 24, 21 24, 20 21 C 19 19, 20 18, 22 18 Z" fill="#191817" />
  <circle cx="23" cy="19" r="1" fill="#FFFFFF" fill-opacity="0.5" />

