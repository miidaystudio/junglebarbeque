  <!-- Sparkle near top-right -->
  <path d="M 49 11 L 51 16 L 56 18 L 51 20 L 49 25 L 47 20 L 42 18 L 47 16 Z" fill="#EB4823" stroke="#191817" stroke-width="1.5" />
